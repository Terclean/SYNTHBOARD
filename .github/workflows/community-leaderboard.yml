name: Update Community Leaderboard

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  issues:
    types: [labeled, unlabeled, edited, reopened, closed]

permissions:
  contents: write
  issues: read
  actions: write

concurrency:
  group: 'community-leaderboard-sync'
  cancel-in-progress: false

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync approved community racks and votes
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/sync-community-leaderboard.mjs

      - name: Commit, push and trigger Pages deploy if changed
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/community/index.json; then
            git add public/community/index.json
            git commit -m "chore: sync community leaderboard tracks and votes"
            git push origin HEAD:main
            echo "Triggering Deploy SYNTHBOARD to GitHub Pages workflow..."
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/deploy.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
