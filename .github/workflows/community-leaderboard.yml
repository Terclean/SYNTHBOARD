name: Update Community Leaderboard

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync GitHub issue votes into public/community/index.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "public/community/index.json";
            const current = JSON.parse(fs.readFileSync(path, "utf8"));
            const existingById = new Map((current.tracks || []).map((t) => [t.id, t]));
            async function run() {
              const res = await fetch(`https://api.github.com/repos/${process.env.REPO}/issues?labels=community-rack&state=open&per_page=100`, {
                headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" }
              });
              if (!res.ok) throw new Error(`GitHub API ${res.status}`);
              const issues = await res.json();
              for (const issue of issues) {
                const votes = (issue.reactions && issue.reactions["+1"]) || 0;
                const id = `issue-${issue.number}`;
                const prev = existingById.get(id);
                if (prev) {
                  prev.votes = votes;
                  prev.issueUrl = issue.html_url;
                }
              }
              current.updatedAt = new Date().toISOString();
              current.tracks.sort((a, b) => (b.votes || 0) - (a.votes || 0));
              fs.writeFileSync(path, JSON.stringify(current, null, 2) + "\n");
            }
            run().catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Commit updated leaderboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet public/community/index.json || (git add public/community/index.json && git commit -m "chore: update community leaderboard votes" && git push)
